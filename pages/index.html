<!-- The world drawer -->
<!-- Could you help with the development? https://github.com/nennneko5787/world-drawer -->

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The world drawer</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/index.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js" defer></script>
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js" defer></script>
    <script src="/static/js/index.js" defer></script>
</head>
<body>
    <canvas id="board"></canvas>

    <header id="topbar">
        <div class="brand"><i class="bi bi-globe"></i><span>world-drawer</span></div>
        <div id="coords" class="pill" data-i18n-title="coordsTitle" title="カーソル位置のキャンバス座標">(0, 0)</div>
        <div id="cooldown" class="pill" data-i18n="ready">準備OK</div>
        <div id="level" class="pill" data-i18n-title="levelWord" title="レベル">Lv1 0/3xp</div>
        <button id="online" class="pill clickable" data-i18n-title="onlineTitle" title="オンライン中のユーザー一覧"><i class="bi bi-people"></i> <span id="onlineCount">1</span></button>
        <button id="accountBtn" class="pill clickable" data-i18n-title="accountTitle" title="アカウント引っ越し"><i class="bi bi-person"></i></button>
        <a id="helpBtn" class="pill clickable" data-i18n-title="helpTitle" title="ヘルプ" href="/help"><i class="bi bi-question-circle"></i></a>
        <button id="settingsBtn" class="pill clickable" data-i18n-title="settingsTitle" title="設定"><i class="bi bi-gear"></i></button>
    </header>

    <div id="settingsPanel" class="hidden">
        <label class="setRow"><input type="checkbox" id="gridToggle" checked> <span data-i18n="setGrid">グリッド表示</span></label>
        <label class="setRow"><input type="checkbox" id="cursorToggle" checked> <span data-i18n="setCursors">他のカーソル表示</span></label>
        <label class="setRow"><input type="checkbox" id="draftToggle" checked> <span data-i18n="setDrafts">設計図表示</span></label>
        <label class="setRow"><input type="checkbox" id="axisToggle" checked> <span data-i18n="setAxes">原点軸表示</span></label>
        <label class="setRow"><input type="checkbox" id="zoneToggle" checked> <span data-i18n="setZone">配置可能範囲表示</span></label>
        <label class="setRow"><span data-i18n="setCursorRate">カーソル送信</span>
            <select id="cursorRateSel" data-i18n-title="setCursorRate" title="カーソルの送信頻度">
                <option value="200" data-i18n="rateCalm">ひかえめ</option>
                <option value="80" data-i18n="rateStandard">標準</option>
                <option value="30" data-i18n="rateSmooth">なめらか</option>
                <option value="15" data-i18n="rateVerySmooth">とてもなめらか</option>
                <option value="5" data-i18n="rateUltra">超なめらか</option>
            </select>
        </label>
        <div class="setRow"><span data-i18n="fpsWord">FPS</span> <b id="fpsVal">-</b> ・ <span data-i18n="cacheWord">キャッシュ</span> <b id="cacheVal">-</b></div>
        <label class="setRow"><span data-i18n="setTheme">テーマ</span>
            <select id="themeSel" data-i18n-title="setTheme" title="テーマ">
                <option value="auto" data-i18n="themeAuto">自動</option>
                <option value="light" data-i18n="themeLight">ライト</option>
                <option value="dark" data-i18n="themeDark">ダーク</option>
            </select>
        </label>
        <label class="setRow"><span data-i18n="setLang">言語</span>
            <select id="langSel" data-langsel data-i18n-title="setLang" title="言語">
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="ko">한국어</option>
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
            </select>
        </label>
    </div>

    <div id="profileBar">
        <input id="profileName" maxlength="20" data-i18n-ph="profileNamePh" placeholder="名前" title="表示名">
        <button id="profileColorBtn" data-i18n-title="profileColorTitle" title="カーソル・名前の色（詳細指定）"><span id="profileColorChip"></span></button>
        <button id="profileSave" data-i18n-title="profileSave" title="名前と色を保存" data-i18n="profileSave">保存</button>
        <span id="myUid" data-i18n-title="myUidTitle" title="あなたの固定ID">#------</span>
    </div>

    <div id="userPanel" class="hidden">
        <div class="panelTitle" data-i18n="onlinePanel">オンライン</div>
        <ul id="userList"></ul>
    </div>

    <aside id="historyPanel" class="hidden">
        <div class="panelTitle"><span id="historyTitle">履歴</span><button id="historyClose" data-i18n-title="close" title="閉じる"><i class="bi bi-x-lg"></i></button></div>
        <ul id="historyList"></ul>
    </aside>

    <aside id="accountPanel" class="hidden">
        <div class="panelTitle"><span data-i18n="accountTitle">アカウント引っ越し</span><button id="accountClose" data-i18n-title="close" title="閉じる"><i class="bi bi-x-lg"></i></button></div>
        <div class="accSection">
            <div class="accLabel" data-i18n="accOutLabel">この端末のアカウントを別端末で使う</div>
            <input id="issuePassword" type="password" data-i18n-ph="accPwPh" placeholder="パスワード (8文字以上)" autocomplete="new-password">
            <button id="issueBtn" data-i18n="issueBtn">コード発行</button>
            <div id="issueResult" class="accCode hidden"></div>
        </div>
        <div class="accSection">
            <div class="accLabel" data-i18n="accInLabel">別端末のアカウントでログイン</div>
            <input id="loginCode" data-i18n-ph="loginCodePh" placeholder="引っ越しコード (XXXX-XXXX)" autocomplete="off">
            <input id="loginPassword" type="password" data-i18n-ph="loginPwPh" placeholder="パスワード" autocomplete="current-password">
            <button id="loginBtn" data-i18n="loginBtn">ログイン</button>
        </div>
    </aside>

    <div id="toast-wrap"></div>

    <button id="undoBtn" class="hidden" data-i18n-title="undoTitle" title="直前の配置を取り消す">取り消し</button>

    <aside id="colorPanel" class="hidden">
        <div class="panelTitle"><span data-i18n="colorPanelT">色の詳細指定</span><button id="colorClose" data-i18n-title="close" title="閉じる"><i class="bi bi-x-lg"></i></button></div>
        <canvas id="cpSv" width="220" height="190" role="img" data-i18n-aria="cpSvAria" aria-label="鮮やかさ（横）と明るさ（縦）の選択"></canvas>
        <label class="cpSliderLabel" for="cpHue" data-i18n="hueLabel">色相</label>
        <input id="cpHue" type="range" min="0" max="359" value="0" data-i18n-title="hueLabel" title="色相" data-i18n-aria="hueLabel" aria-label="色相">
        <div class="seg cpTabs" data-i18n-aria="colorPanelT" aria-label="形式">
            <button data-fmt="hex" class="active">HEX</button>
            <button data-fmt="rgb">RGB</button>
            <button data-fmt="hsv">HSV</button>
            <button data-fmt="hsl">HSL</button>
        </div>
        <div class="cpForm" data-fmt="hex"><span>#</span><input id="cpHex" maxlength="7" spellcheck="false" autocomplete="off" placeholder="ff0000"></div>
        <div class="cpForm hidden" data-fmt="rgb">
            <label>R<input id="cpR" type="number" min="0" max="255"></label>
            <label>G<input id="cpG" type="number" min="0" max="255"></label>
            <label>B<input id="cpB" type="number" min="0" max="255"></label>
        </div>
        <div class="cpForm hidden" data-fmt="hsv">
            <label>H<input id="cpHsvH" type="number" min="0" max="359"></label>
            <label>S<input id="cpHsvS" type="number" min="0" max="100"></label>
            <label>V<input id="cpHsvV" type="number" min="0" max="100"></label>
        </div>
        <div class="cpForm hidden" data-fmt="hsl">
            <label>H<input id="cpHslH" type="number" min="0" max="359"></label>
            <label>S<input id="cpHslS" type="number" min="0" max="100"></label>
            <label>L<input id="cpHslL" type="number" min="0" max="100"></label>
        </div>
        <div class="cpFoot"><span id="cpPreview"></span><button id="cpOk" data-i18n="close">閉じる</button></div>
    </aside>

    <footer id="toolbar">
        <button id="chromeToggle" data-i18n-title="chromeToggleT" title="ツールバーの表示切替（描画領域を広げる）"><i class="bi bi-chevron-down"></i></button>
        <div class="row">
            <button id="colorBtn" data-i18n-title="colorBtnTitle" title="塗る色（詳細指定）"><span id="colorChip"></span></button>
            <div id="swatches" data-i18n-title="swatchTitleNoColor" title="選択。選択済みを押すと詳細編集"></div>
        </div>
        <div class="row">
            <div class="seg" role="tablist" data-i18n-aria="toolsAria" aria-label="ツール">
                <button id="toolPen" class="active" data-i18n-title="toolPenT" title="1ピクセル塗る"><i class="bi bi-pen"></i><span data-i18n="toolPen">塗る</span></button>
                <button id="toolEraser" data-i18n-title="toolEraserT" title="1ピクセル消す"><i class="bi bi-eraser"></i><span data-i18n="toolEraser">消す</span></button>
                <button id="toolHistory" data-i18n-title="toolHistoryT" title="クリックしたマスの履歴を見る"><i class="bi bi-clock-history"></i><span data-i18n="toolHistory">履歴</span></button>
                <button id="toolDraft" data-i18n-title="toolDraftT" title="設計図を描く (自分だけに薄く表示)"><i class="bi bi-rulers"></i><span data-i18n="toolDraft">設計図</span></button>
                <button id="toolEyedropper" data-i18n-title="toolEyedropT" title="スポイト：マスの色を取る"><i class="bi bi-eyedropper"></i><span data-i18n="toolEyedrop">スポイト</span></button>
            </div>
            <div class="seg" data-i18n-aria="inkAria" aria-label="インク">
                <button data-ink="normal" class="ink active" data-i18n-title="inkNormalT" title="通常インク (無制限)"><span data-i18n="inkNormal">通常</span></button>
                <button data-ink="glow" class="ink" data-i18n-title="inkGlowT" title="発光インク"><i class="bi bi-stars"></i><span data-i18n="inkGlow">発光</span> <b id="c-glow">0</b></button>
                <button data-ink="rainbow" class="ink" data-i18n-title="inkRainbowT" title="虹色インク"><i class="bi bi-rainbow"></i><span data-i18n="inkRainbow">虹</span> <b id="c-rainbow">0</b></button>
                <button data-ink="ghost" class="ink" data-i18n-title="inkGhostT" title="ゴーストインク (半透明)"><i class="bi bi-circle-half"></i><span data-i18n="inkGhost">ゴースト</span> <b id="c-ghost">0</b></button>
            </div>
            <div class="seg">
                <button id="zoomOut" data-i18n-title="zoomOut" title="縮小"><i class="bi bi-dash"></i></button>
                <button id="zoomOrigin" data-i18n-title="zoomOrigin" title="原点(0,0)へ移動"><i class="bi bi-crosshair"></i></button>
                <button id="zoomIn" data-i18n-title="zoomIn" title="拡大"><i class="bi bi-plus"></i></button>
            </div>
        </div>
        <div class="row hint" data-i18n="hintRow">左クリックで配置 ・ ドラッグ/右ドラッグで移動 ・ 色ボタンで詳細指定</div>
    </footer>
</body>
</html>
