<!-- pixDraw - admin (管理者専用・検索避け) -->

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="adminTitle">管理</title>
    <meta name="robots" content="noindex,nofollow">
    <!-- OGP-START -->
    <meta name="description" content="管理者用の操作ページ。">
    <link rel="canonical" href="/admin">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="pixDraw">
    <meta property="og:title" content="管理 - pixDraw">
    <meta property="og:description" content="管理者用の操作ページ。">
    <meta property="og:url" content="/admin">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="pixDraw">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:locale:alternate" content="ko_KR">
    <meta property="og:locale:alternate" content="zh_CN">
    <meta property="og:locale:alternate" content="zh_TW">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="管理 - pixDraw">
    <meta name="twitter:description" content="管理者用の操作ページ。">
    <meta name="twitter:image" content="/og-image.png">
    <meta name="theme-color" content="#ffffff">
    <!-- OGP-END -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="application-name" content="pixDraw">
    <meta name="apple-mobile-web-app-title" content="pixDraw">
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" type="image/x-icon">
    <link rel="icon" href="/static/img/icon-192.png" sizes="192x192" type="image/png">
    <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png">
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/help.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js" defer></script>
    <script src="/static/js/wd-markdown.js" defer></script>
    <script src="/static/js/pwa.js" defer></script>
    <script src="/static/js/admin-page.js" defer></script>
</head>
<body class="admin">
    <main class="admWrap">
        <header class="admHead">
            <h1><span class="admShield"><i class="bi bi-shield"></i></span> <span data-i18n="adminTitle">管理</span></h1>
            <div class="admHeadActs">
                <label class="langRow"><span data-i18n="setLang">言語</span>:
                    <select id="langSel" data-langsel>
                        <option value="ja">日本語</option>
                        <option value="en">English</option>
                        <option value="ko">한국어</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                    </select>
                </label>
                <a class="backBtn" href="/" data-i18n="h_back">キャンバスに戻る</a>
            </div>
        </header>
        <p id="admAuthLine" class="admAuth"></p>

        <div id="admBody" class="hidden">
            <section class="admCard">
                <h2><i class="bi bi-activity"></i> <span data-i18n="admSecStatus">状況</span></h2>
                <div class="admRow">
                    <button id="admRefresh" class="admBtn" data-i18n="admRefresh">更新</button>
                    <label class="admCheck"><input type="checkbox" id="admAuto"> <span data-i18n="admAuto">自動更新</span></label>
                </div>
                <div id="admStatus" class="admGrid"></div>
                <div class="admTables">
                    <div>
                        <h3 data-i18n="admBanned">禁止IP</h3>
                        <div id="admBannedList"></div>
                        <p class="admMuted" data-i18n="admTopRemoved">配置・セッション上位IPは負荷のため表示しません</p>
                    </div>
                </div>
            </section>

            <section class="admCard">
                <h2><i class="bi bi-image"></i> <span data-i18n="admSecMap">マップ画像</span></h2>
                <p class="admMuted" data-i18n="admMapHint">一番外側のピクセル＋余白で切り出したPNGを保存します</p>
                <div class="admRow">
                    <label><span data-i18n="admMapMargin">余白</span> <input id="admMapMargin" type="number" min="0" max="512" value="16"></label>
                    <label><span data-i18n="admMapMax">上限px (0=無し)</span> <input id="admMapMax" type="number" min="0" value="4096"></label>
                    <button id="admMapBtn" class="admBtn" data-i18n="admMapDownload">PNGを保存</button>
                </div>
                <p id="admMapMsg" class="admMuted"></p>
            </section>

            <section class="admCard">
                <h2><i class="bi bi-person"></i> <span data-i18n="admSecUser">ユーザー操作</span></h2>
                <div class="admRow">
                    <input id="admUid" data-i18n-ph="adminUidPh" placeholder="対象UID" autocomplete="off" spellcheck="false">
                    <button id="admLookupBtn" class="admBtn" data-i18n="adminLookup">照会</button>
                </div>
                <div id="admUserCard"></div>
                <div class="admRow">
                    <label><span data-i18n="admLimit">上限</span> <input id="admLimit" type="number" min="1" max="5000" value="1000"></label>
                    <button id="admRollbackBtn" class="admBtn danger" data-i18n="adminRollback">巻き戻し</button>
                </div>
                <div class="admRow">
                    <label><span data-i18n="admDuration">期間</span>
                        <select id="admDuration">
                            <option value="3600">1h</option>
                            <option value="86400" selected>24h</option>
                            <option value="604800">7d</option>
                        </select>
                    </label>
                    <button id="admBanBtn" class="admBtn danger" data-i18n="admBan">禁止する</button>
                </div>
                <p id="admMsg" class="admMuted"></p>
            </section>

            <section class="admCard">
                <h2><i class="bi bi-megaphone"></i> <span data-i18n="admSecNotices">お知らせ投稿</span></h2>
                <p class="admMuted" data-i18n="admNoticesHint">管理者UIDのみ投稿・編集・削除できます</p>
                <div class="admRow">
                    <input id="admNoticeTitle" data-i18n-ph="noticesTitlePh" placeholder="タイトル" autocomplete="off" spellcheck="false" maxlength="200">
                    <select id="admNoticeLang" title="編集言語">
                        <option value="ja">日本語</option>
                        <option value="en">English</option>
                        <option value="ko">한국어</option>
                        <option value="zh-CN">简体中文</option>
                        <option value="zh-TW">繁體中文</option>
                    </select>
                </div>
                <div class="admRow">
                    <textarea id="admNoticeBody" data-i18n-ph="noticesBodyPh" placeholder="本文" rows="4" maxlength="20000"></textarea>
                </div>
                <div class="admRow">
                    <button id="admNoticePost" class="admBtn" data-i18n="noticesPost">投稿</button>
                    <button id="admNoticeCancel" class="admBtn ghost hidden" data-i18n="close">閉じる</button>
                </div>
                <div id="admNoticeList"></div>
            </section>
        </div>
    </main>
</body>
</html>
