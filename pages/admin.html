<!-- pixDraw - admin (管理者専用・検索避け) -->

<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="adminTitle">管理</title>
    <meta name="robots" content="noindex,nofollow">
    <!-- OGP-START -->
    <meta name="description" content="管理者用の操作ページ。">
    <link rel="canonical" href="/admin">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="pixDraw">
    <meta property="og:title" content="管理 - pixDraw">
    <meta property="og:description" content="管理者用の操作ページ。">
    <meta property="og:url" content="/admin">
    <meta property="og:image" content="/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:alt" content="pixDraw">
    <meta property="og:locale" content="ja_JP">
    <meta property="og:locale:alternate" content="en_US">
    <meta property="og:locale:alternate" content="ko_KR">
    <meta property="og:locale:alternate" content="zh_CN">
    <meta property="og:locale:alternate" content="zh_TW">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="管理 - pixDraw">
    <meta name="twitter:description" content="管理者用の操作ページ。">
    <meta name="twitter:image" content="/og-image.png">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="/static/logo.png" type="image/png">
    <link rel="apple-touch-icon" href="/static/logo.png">
    <!-- OGP-END -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/static/css/help.css">
    <link rel="stylesheet" href="/static/css/admin.css">
    <script src="/static/js/theme.js"></script>
    <script src="/static/js/i18n.js" defer></script>
    <script src="/static/js/admin-page.js" defer></script>
    <style>
        .langRow { margin: 8px 0 0; font-size: 13px; }
        .langRow select { font-size: 13px; padding: 4px 6px; border-radius: 8px; }
    </style>
</head>
<body class="help">
    <main class="helpWrap">
        <h1><i class="bi bi-shield"></i> <span data-i18n="adminTitle">管理</span></h1>
        <p><a class="backBtn" href="/" data-i18n="h_back">キャンバスに戻る</a></p>
        <p class="langRow"><span data-i18n="setLang">言語</span>:
            <select id="langSel" data-langsel>
                <option value="ja">日本語</option>
                <option value="en">English</option>
                <option value="ko">한국어</option>
                <option value="zh-CN">简体中文</option>
                <option value="zh-TW">繁體中文</option>
            </select>
        </p>

        <h2><span data-i18n="adminTitle">管理</span></h2>
        <p id="admAuthLine" class="admMuted"></p>

        <div id="admBody" class="hidden">
            <h2 data-i18n="admSecStatus">状況</h2>
            <div class="admRow">
                <button id="admRefresh" data-i18n="admRefresh">更新</button>
                <label class="admCheck"><input type="checkbox" id="admAuto"> <span data-i18n="admAuto">自動更新</span></label>
            </div>
            <div id="admStatus" class="admGrid"></div>
            <h3 data-i18n="admBanned">禁止IP</h3>
            <div id="admBannedList"></div>
            <h3 data-i18n="admTopPlace">配置試行が多いIP</h3>
            <div id="admTopPlace"></div>
            <h3 data-i18n="admTopSession">セッション発行が多いIP</h3>
            <div id="admTopSession"></div>

            <h2 data-i18n="admSecUser">ユーザー操作</h2>
            <div class="admRow">
                <input id="admUid" data-i18n-ph="adminUidPh" placeholder="対象UID" autocomplete="off" spellcheck="false">
                <button id="admLookupBtn" data-i18n="adminLookup">照会</button>
            </div>
            <div id="admUserCard"></div>
            <div class="admRow">
                <label><span data-i18n="admLimit">上限</span> <input id="admLimit" type="number" min="1" max="5000" value="1000"></label>
                <button id="admRollbackBtn" data-i18n="adminRollback">巻き戻し</button>
            </div>
            <div class="admRow">
                <label><span data-i18n="admDuration">期間</span>
                    <select id="admDuration">
                        <option value="3600">1h</option>
                        <option value="86400" selected>24h</option>
                        <option value="604800">7d</option>
                    </select>
                </label>
                <button id="admBanBtn" data-i18n="admBan">禁止する</button>
            </div>
            <p id="admMsg" class="admMuted"></p>

            <h2 data-i18n="admSecNotices">お知らせ投稿</h2>
            <p class="admMuted" data-i18n="admNoticesHint">管理者UIDのみ投稿・編集・削除できます</p>
            <div class="admRow">
                <input id="admNoticeTitle" data-i18n-ph="noticesTitlePh" placeholder="タイトル" autocomplete="off" spellcheck="false" maxlength="200">
            </div>
            <div class="admRow">
                <textarea id="admNoticeBody" data-i18n-ph="noticesBodyPh" placeholder="本文" rows="4" maxlength="20000"></textarea>
            </div>
            <div class="admRow">
                <button id="admNoticePost" data-i18n="noticesPost">投稿</button>
                <button id="admNoticeCancel" class="hidden" data-i18n="close">閉じる</button>
            </div>
            <div id="admNoticeList"></div>
        </div>
    </main>
</body>
</html>
