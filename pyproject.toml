[project]
name = "world-drawer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiofiles>=25.1.0",
    "aiosqlite>=0.22.1",
    "brotli>=1.2.0",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "pillow>=11.0.0",
    "pydantic>=2.13.5",
    "python-socketio>=5.16.4",
    "redis>=5.2.0",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "C90",
    "SIM", "RET", "RUF", "PL", "ASYNC", "S", "DTZ", "T",
    "Q", "YTT", "FLY", "PERF", "FBT", "EM", "TRY", "LOG",
    "INP", "PIE", "PGH",
]
ignore = [
    # camelCase要求のため mixed-case 系は除外
    "N802", "N803", "N806", "N815", "N816",
]
